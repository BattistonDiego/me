<!doctype html><meta charset="utf-8"><title>Resize local photo</title><input id="file" type="file" accept="image/*"><button id="make">Export 800px WebP</button><p id="status">Choose the attached local photo.</p><script>const f=document.querySelector('#file'),s=document.querySelector('#status');document.querySelector('#make').onclick=()=>{if(!f.files[0])return;s.textContent='Processing…';const i=new Image();i.onload=()=>{const c=document.createElement('canvas');c.width=800;c.height=Math.round(i.height*800/i.width);c.getContext('2d').drawImage(i,0,0,c.width,c.height);c.toBlob(b=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='foto-diego.webp';a.textContent='Save foto-diego.webp';s.replaceChildren(a,document.createTextNode(' — '+c.width+'×'+c.height+', '+Math.round(b.size/1024)+' KB'));},'image/webp',.84)};i.src=URL.createObjectURL(f.files[0])};</script>
